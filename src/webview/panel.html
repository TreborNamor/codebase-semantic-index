<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
	content="default-src 'none';
		script-src 'unsafe-inline' __CSP_SOURCE__ blob:;
		connect-src https: blob: data:;
		worker-src blob:;
		style-src 'unsafe-inline';">
<title>Codebase Semantic Index</title>
<style>
:root{--csi-cyan:#53c7f5;--csi-cyan-hover:#7bd8ff;--csi-green:#4fdda8;--csi-violet:#bd9cff;--csi-amber:#ffc66d;--csi-coral:#ff827d;--csi-ink:#101821;--csi-surface:#17212c;--csi-line:#304254}
*{box-sizing:border-box;margin:0;padding:0}
body{
	font-family:var(--vscode-font-family,sans-serif);
	font-size:var(--vscode-font-size,13px);
	background:var(--vscode-editor-background,#1e1e1e);
	color:var(--vscode-editor-foreground,#d4d4d4);
	padding:14px;display:flex;flex-direction:column;gap:10px
}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h2{font-size:1.05em;font-weight:700;white-space:nowrap;color:var(--csi-cyan)}
.status-pills{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.badge{
	padding:2px 8px;border-radius:10px;font-size:.8em;white-space:nowrap;
	background:var(--csi-cyan);color:var(--csi-ink);font-weight:600;box-shadow:0 0 12px #53c7f533
}
.badge.model.idle{background:var(--csi-line);color:var(--vscode-editor-foreground,#d4d4d4);box-shadow:none}
.badge.model.loading{background:var(--csi-violet);color:#1a1027;box-shadow:0 0 12px #bd9cff33}
.badge.model.ok{background:var(--csi-green);color:#092019;box-shadow:0 0 12px #4fdda833}
.badge.model.err{background:var(--csi-coral);color:#2a0d0c;box-shadow:0 0 12px #ff827d33}
.badge.ok{background:var(--csi-green);color:#092019;box-shadow:0 0 12px #4fdda833}
.badge.err{background:var(--csi-coral);color:#2a0d0c;box-shadow:0 0 12px #ff827d33}
button{
	background:var(--csi-cyan);color:var(--csi-ink);border:1px solid transparent;
	padding:5px 14px;cursor:pointer;border-radius:5px;font:inherit;font-size:.9em;font-weight:600;
	transition:background .15s ease,box-shadow .15s ease,transform .15s ease
}
button:disabled{opacity:.45;cursor:default}
button:not(:disabled):hover{background:var(--csi-cyan-hover);box-shadow:0 0 14px #53c7f544;transform:translateY(-1px)}
#actions{display:flex;gap:8px;align-items:center}
#progress-section{display:none;flex-direction:column;gap:4px}
#progress-label{font-size:.85em;color:var(--csi-cyan)}
.pbar{background:var(--csi-line);height:4px;border-radius:4px;overflow:hidden}
#pbar-fill{background:linear-gradient(90deg,var(--csi-cyan),var(--csi-violet),var(--csi-green));height:100%;width:0%;transition:width .25s ease;border-radius:inherit}
#progress-detail{font-size:.8em;color:var(--csi-violet);font-family:var(--vscode-editor-font-family,monospace)}
#embed-section{display:none;flex-direction:column;gap:4px}
#embed-label{font-size:.85em;color:var(--csi-violet)}
#embed-fill{background:linear-gradient(90deg,var(--csi-violet),var(--csi-cyan));height:100%;width:0%;transition:width .1s ease;border-radius:inherit}
#embed-detail{font-size:.8em;color:var(--csi-cyan);font-family:var(--vscode-editor-font-family,monospace)}
#search-section{display:none;flex-direction:column;gap:8px}
.search-row{display:flex;gap:6px}
#search-input{
	flex:1;min-width:0;background:var(--csi-ink);
	color:var(--vscode-input-foreground,#d4d4d4);
	border:1px solid var(--csi-line);
	padding:7px 9px;border-radius:5px;font:inherit;transition:border-color .15s ease,box-shadow .15s ease
}
#search-input:focus{outline:none;border-color:var(--csi-cyan);box-shadow:0 0 0 2px #53c7f533}
#results{display:flex;flex-direction:column;gap:6px;max-height:65vh;overflow-y:auto}
.result{
	padding:8px 10px;
	background:var(--csi-surface);
	border:1px solid var(--csi-line);border-radius:6px;cursor:pointer;transition:border-color .15s ease,background .15s ease
}
.result:hover{
	background:#1c2a38;
	border-color:var(--csi-violet);box-shadow:0 0 12px #bd9cff22
}
.result-header{display:flex;gap:6px;align-items:baseline;font-size:.82em;margin-bottom:4px;flex-wrap:wrap}
.result-file{color:var(--csi-cyan);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-loc{color:var(--csi-amber);white-space:nowrap}
.result-sym{color:var(--csi-violet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.result-score{color:var(--csi-green);font-weight:700;white-space:nowrap}
.result-preview{
	font-family:var(--vscode-editor-font-family,monospace);font-size:11px;
	white-space:pre-wrap;overflow:hidden;max-height:3.8em;
	color:var(--vscode-editor-foreground,#d4d4d4);opacity:.8
}
.no-results{color:var(--vscode-descriptionForeground,#888);font-size:.9em;padding:8px 0}
</style>
</head>
<body>

<header>
	<h2>&#x1F50D; Codebase Semantic Index</h2>
	<div class="status-pills" aria-label="Model and index status">
		<span id="model-badge" class="badge model idle">Model not loaded</span>
		<span id="badge" class="badge">Initializing&#x2026;</span>
	</div>
</header>

<div id="actions">
	<button id="btn-build" disabled>Build Index</button>
</div>

<div id="progress-section">
	<div id="progress-label">&#x2026;</div>
	<div class="pbar"><div id="pbar-fill"></div></div>
	<div id="progress-detail"></div>
</div>
<div id="embed-section">
	<div id="embed-label">Generating embeddings&#x2026;</div>
	<div class="pbar"><div id="embed-fill"></div></div>
	<div id="embed-detail"></div>
</div>
<div id="search-section">
	<p id="search-status" role="status" class="no-results"></p>
	<div class="search-row">
		<input id="search-input" type="text" placeholder="Describe what you&#x2019;re looking for&#x2026;"
			autocomplete="off" spellcheck="false" />
		<button id="btn-search" disabled>Search</button>
	</div>
	<div id="results"></div>
</div>

<script type="module">
const vscode = acquireVsCodeApi();

// DOM refs
const badge         = document.getElementById('badge');
const modelBadge    = document.getElementById('model-badge');
const btnBuild      = document.getElementById('btn-build');
const progressSec   = document.getElementById('progress-section');
const progressLabel = document.getElementById('progress-label');
const pbarFill      = document.getElementById('pbar-fill');
const progressDet   = document.getElementById('progress-detail');
const searchSec     = document.getElementById('search-section');
const searchInput   = document.getElementById('search-input');
const btnSearch     = document.getElementById('btn-search');
const resultsEl     = document.getElementById('results');
const searchStatus  = document.getElementById('search-status');
const embedSec      = document.getElementById('embed-section');
const embedLabel    = document.getElementById('embed-label');
const embedFill     = document.getElementById('embed-fill');
const embedDetail   = document.getElementById('embed-detail');
// Runtime state
let isIndexing = false;
let hasWorkspace = false;
let modelReady = false;
let indexBusy = false;

// UI helpers
function setBadge(text, cls) {
	badge.textContent = text;
	badge.hidden = !text;
	badge.className = 'badge' + (cls ? ' ' + cls : '');
}
function setChunkCountBadge(count) {
	setBadge(count > 0 ? count + ' chunks indexed' : '', count > 0 ? 'ok' : '');
}
function updateActions() {
	btnBuild.disabled = !hasWorkspace || !modelReady || isIndexing || indexBusy;
	btnSearch.disabled = !modelReady || isIndexing;
}
function setModelStatus(status) {
	modelReady = status?.state === 'ready';
	if (modelReady) {
		modelBadge.textContent = 'Model ready';
		modelBadge.className = 'badge model ok';
	} else if (status?.state === 'loading') {
		modelBadge.textContent = 'Loading Qwen…';
		modelBadge.className = 'badge model loading';
	} else if (status?.state === 'error') {
		modelBadge.textContent = 'Model error';
		modelBadge.className = 'badge model err';
		searchStatus.textContent = status.message || 'Qwen could not be loaded.';
	} else {
		modelBadge.textContent = 'Model not loaded';
		modelBadge.className = 'badge model idle';
	}
	updateActions();
}
function showProgress(label, pct, detail) {
	progressSec.style.display = 'flex';
	progressLabel.textContent = label;
	pbarFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
	progressDet.textContent = detail || '';
}
function hideProgress() { progressSec.style.display = 'none'; }
function showSearch()   { searchSec.style.display = 'flex'; }

let embedStartTime = 0;
function showEmbedProgress(done, total, currentFile) {
	embedSec.style.display = 'flex';
	const pct = total > 0 ? (done / total) * 100 : 0;
	embedFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
	const eta = done > 0 ? Math.round(((Date.now() - embedStartTime) / done) * (total - done) / 1000) : null;
	const etaStr = eta !== null && eta > 0 ? '  \u2014  ~' + (eta >= 60 ? Math.floor(eta/60) + 'm ' + (eta%60) + 's' : eta + 's') + ' left' : '';
	embedDetail.textContent = done + ' / ' + total + ' chunks' + (currentFile ? '  \u2014  ' + currentFile : '') + etaStr;
}
function hideEmbedProgress() { embedSec.style.display = 'none'; }

// Search — delegate to extension host (embedding happens in the worker panel)
async function runSearch() {
	const query = searchInput.value.trim();
	if (!query || !modelReady) return;

	btnSearch.disabled = true;
	setBadge('Searching\u2026');
	vscode.postMessage({ type: 'searchQuery', query });
}

// Results rendering
function esc(s)  { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s) { return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function displayResults(results) {
	if (!results.length) {
		resultsEl.innerHTML = '<p class="no-results">No results found.</p>';
		return;
	}
	resultsEl.innerHTML = results.map(({ chunk, score }) => {
		const rank = score.toFixed(4);
		const loc = 'L' + (chunk.range.start + 1) + '\u2013' + (chunk.range.end + 1);
		const sym = chunk.symbolName
			? '<span class="result-sym">' + esc(chunk.symbolName) + '</span>' : '';
		return '<div class="result"' +
			' data-root="' + escA(chunk.rootUri) + '"' +
			' data-file="' + escA(chunk.file) + '"' +
			' data-start-character="' + (chunk.range.startCharacter || 0) + '"' +
			' data-end-character="' + (chunk.range.endCharacter || 0) + '"' +
			' data-start="' + chunk.range.start + '"' +
			' data-end="'   + chunk.range.end   + '">' +
			'<div class="result-header">' +
				'<span class="result-file">'  + esc(chunk.file) + '</span>' +
				'<span class="result-loc">'   + loc + '</span>' +
				sym +
				'<span class="result-score">rank ' + rank + '</span>' +
			'</div>' +
			'<pre class="result-preview">' + esc(chunk.preview) + '</pre>' +
			'</div>';
	}).join('');

	resultsEl.querySelectorAll('.result').forEach(el => {
		el.addEventListener('click', () => vscode.postMessage({
			type: 'openFile',
			rootUri: el.dataset.root,
			file:  el.dataset.file,
			startCharacter: +el.dataset.startCharacter,
			endCharacter: +el.dataset.endCharacter,
			start: +el.dataset.start,
			end:   +el.dataset.end,
		}));
	});
}

// Message handler (extension -> webview)
window.addEventListener('message', async e => {
	const msg = e.data;
	switch (msg.type) {
		case 'init':
			hasWorkspace = msg.hasWorkspace !== false;
			btnBuild.textContent = msg.hasIndex ? 'Rebuild Index' : 'Build Index';
			setBadge(msg.hasIndex ? 'Loading index\u2026' : 'No index yet');
			updateActions();
			if (msg.autoBuild) setTimeout(() => btnBuild.click(), 50);
			break;

		case 'loadIndex':
			indexBusy = !!msg.busy;
			if (msg.busy) setBadge('Updating index...');
			else if (msg.message) setBadge(msg.message, 'err');
			else setChunkCountBadge(msg.chunkCount);
			searchStatus.textContent = msg.message || 'Results are verified against current workspace files and unsaved edits.';
			btnBuild.textContent = 'Rebuild Index';
			showSearch();
			updateActions();
			break;

		case 'modelStatus':
			setModelStatus(msg.status);
			break;

		case 'triggerBuild':
			if (!isIndexing && !btnBuild.disabled) btnBuild.click();
			break;

		case 'modelLoading':
			setModelStatus({ state: 'loading' });
			showProgress('Loading Qwen embedding model…', 0,
				msg.mode === 'search' ? 'Semantic search will begin when the model is ready.' : 'Indexing will begin when the model is ready.');
			setBadge('Loading model…');
			break;

		case 'chunkStart':
			showProgress('Chunking files\u2026', 0, '0 / ' + msg.total);
			setBadge('Chunking\u2026');
			break;

		case 'chunkProgress':
			showProgress(
				'Chunking files\u2026',
				(msg.done / msg.total) * 100,
				msg.done + ' / ' + msg.total + '  \u2014  ' + msg.file,
			);
			break;

		case 'embedProgress':
			if (msg.done === 1) {
				embedStartTime = Date.now();
				embedLabel.textContent = 'Generating embeddings (' + msg.total + ' chunks)\u2026';
				hideProgress();
			}
			showEmbedProgress(msg.done, msg.total, msg.file ?? null);
			break;

		case 'startEmbedding':
			setBadge('Embedding ' + msg.chunks.length + ' chunks\u2026');
			break;

		case 'savingIndex':
			hideEmbedProgress();
			showProgress('Saving index\u2026', 100);
			setBadge('Saving\u2026');
			break;

		case 'indexSaved':
			hideProgress();
			hideEmbedProgress();
			indexBusy = false;
			setChunkCountBadge(msg.meta.chunkCount);
			isIndexing = false;
			btnBuild.textContent = 'Rebuild Index';
			showSearch();
			updateActions();
			searchInput.focus();
			break;

		case 'searchResults':
			hideProgress();
			hideEmbedProgress();
			displayResults(msg.results);
			searchStatus.textContent = msg.message || 'Verified current workspace results.';
			setBadge(msg.results.length > 0 ? msg.results.length + ' results' : 'No results', msg.results.length > 0 ? 'ok' : '');
			updateActions();
			break;

		case 'searchError':
			hideProgress();
			hideEmbedProgress();
			setBadge('Search error: ' + msg.message, 'err');
			updateActions();
			break;

		case 'incrementalUpdate':
			setChunkCountBadge(msg.chunkCount);
			break;

		case 'error':
			hideProgress();
			hideEmbedProgress();
			indexBusy = false;
			setBadge('Error: ' + msg.message, 'err');
			isIndexing = false;
			updateActions();
			break;
	}
});

// Button / keyboard wiring
btnBuild.addEventListener('click', () => {
	if (isIndexing || !modelReady || !hasWorkspace) return;
	isIndexing = true;
	updateActions();
	searchSec.style.display = 'none';
	resultsEl.innerHTML = '';
	vscode.postMessage({ type: 'buildIndex' });
});

searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
btnSearch.addEventListener('click', runSearch);

// Announce ready to the extension host
vscode.postMessage({ type: 'webviewReady' });
</script>
</body>
</html>
