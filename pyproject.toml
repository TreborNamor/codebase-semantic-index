[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codeconverge"
version = "0.2.0"
description = "Local, workspace-scoped hybrid code search for VS Code and Copilot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "mcp==2.3.0",
  "pywin32==311; sys_platform == 'win32'",
  "platformdirs==4.5.0",
  "pathspec==0.12.1",
  "numpy==2.5.4",
  "sqlite-vec==0.1.9",
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==1.22.1",
  "psutil==7.2.2",
  "tokenizers==0.23.3",
  "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.19/llama_cpp_python-0.3.19-cp313-cp313-win_amd64.whl",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.2.0", "build==1.3.0"]

[project.scripts]
codeconverge = "codeconverge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "windows: requires Windows named pipes",
  "model: requires the real downloaded Qwen model",
  "copilot: requires an authenticated live Copilot harness",
]
